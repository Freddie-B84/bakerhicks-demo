<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BakerHicks Portfolio Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-image: url('bakerhicks-hero.png'); /* ← rename to match your file */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            color: white;
            padding: 30px;
        }

        /* Dark overlay so the chat widget stays readable */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0);
            z-index: 0;
        }

        .header {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 1;
        }
        
        .logo {
            height: 40px;
        }
        
        .subtitle {
            font-size: 1rem;
            margin-top: 8px;
            color: #c8e63c; /* ← BakerHicks lime green (from the dots in the image) */
        }

        #root {
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="https://bakerhicks.com/visuals/bakerhicks-logo-white.png" alt="BakerHicks" class="logo" />
        <div class="subtitle">Portfolio Performance Assistant</div>
    </div>
    <div id="root"></div>
    <script>
        var popUpWidth = "" + (0.5 * document.documentElement.clientWidth) + "px";
        var popUpHeight = "" + (0.75 * document.documentElement.clientHeight) + "px";
        var layout = {
            width: popUpWidth,
            height: popUpHeight
        };
        window.wxOConfiguration = {
            orchestrationID: "95f3b39ecb0a4fd7b5f71872005ef2f5_99155f47-ac2f-4206-b7c0-bcaf4e8f3838",
            hostURL: "https://eu-gb.watson-orchestrate.cloud.ibm.com",
            rootElementID: "root",
            deploymentPlatform: "ibmcloud",
            crn: "crn:v1:bluemix:public:watsonx-orchestrate:eu-gb:a/95f3b39ecb0a4fd7b5f71872005ef2f5:99155f47-ac2f-4206-b7c0-bcaf4e8f3838::",
            chatOptions: {
                agentId: "f4bf69a4-fed7-4117-8d01-5d69f46c5044",
                agentEnvironmentId: "d627b7a8-6b07-4f85-b750-b3a98e2b14dd",
            },
            layout: layout
        };
        setTimeout(function () {
            const script = document.createElement('script');
            script.src = `${window.wxOConfiguration.hostURL}/wxochat/wxoLoader.js?embed=true`;
            script.addEventListener('load', function () {
                wxoLoader.init();
            });
            document.head.appendChild(script);
        }, 0);
    </script>
</body>
</html>
